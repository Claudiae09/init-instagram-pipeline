name: Daily stories + account snapshot

# Stories expire ~24h after posting and the API only returns ACTIVE ones, so a
# weekly job misses most of them. This runs every day and takes ~20 seconds.
# It also gives account metrics (followers, follower vs non-follower reach) a
# real daily trend instead of one point a week.

on:
  schedule:
    - cron: "0 12 * * *"      # 12:00 UTC daily (~8am ET) — after overnight stories
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull stories + account insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: v23.0
        run: python daily_pull.py

      - name: Push to Google Sheet
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python push_to_sheets.py

      - name: Sync competitor follower counts from the Sheet
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python pull_competitors.py

      - name: Rebuild the dashboard page
        run: python render.py

      - name: Write freshness status
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python write_status.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv/ site/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily stories + account snapshot: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
