name: Daily pull

# Everything runs daily. Stories expire after ~24h so they have to, but posts
# were on a weekly job and that meant a Wednesday post stayed invisible until
# the following Monday, while followers and stories updated every day. The page
# mixed fresh and stale numbers with nothing saying so.
#
# A full pull is ~700 API calls and takes about five minutes, so roughly 150 of
# the 2,000 free Actions minutes a month. Worth it to have one freshness date
# for the whole page instead of two.

on:
  schedule:
    - cron: "0 12 * * *"      # 12:00 UTC daily (~8am ET) — after overnight stories
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull everything
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MEDIA_SINCE: "2025-01-01"
          GRAPH_API_VERSION: v23.0
        run: python instagram_pull.py

      - name: Build Instagram-export-format table
        run: python export_format.py

      - name: Push to Google Sheet
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python push_to_sheets.py

      - name: Sync competitor follower counts from the Sheet
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python pull_competitors.py

      - name: Rebuild the dashboard page
        run: python render.py

      - name: Write freshness status
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python write_status.py

      # Between rendering and deploying, so a regression is caught before it
      # is served rather than after someone notices.
      - name: Run the invariant tests
        run: python tests.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv/ site/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily stories + account snapshot: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      # Last, and after the commit: a deploy failure must not discard the day's
      # data. It did exactly that for two days before this was reordered.
      #
      # wranglerVersion is pinned to 4 because an assets-only Worker has no
      # entry-point script, and wrangler 3 refuses to deploy without one:
      #   "Missing entry-point: ... or the `main` config field"
      - name: Deploy to Cloudflare
        if: env.HAS_CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy
